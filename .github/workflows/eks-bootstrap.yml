name: Terraform EKS Main

on:
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/envs/prod/bootstrap/**'
      - '.github/workflows/eks-bootstrap.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infrastructure/envs/prod/bootstrap/

permissions:
  id-token: write
  contents: read

jobs:
  terraform-eks-bootstrap:
    name: Provision EKS Hardware
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/online-boutique-eks-github-deploy-platform-repo
          aws-region: ${{ env.AWS_REGION }}
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_PASSWD }}

      - name: Terraform Validate
        run: terraform validate

      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_TF_EXCLUDE_DOWNLOADED_MODULES: 'true'
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          scan-ref: ${{ env.TF_WORKING_DIR }}
          skip-dirs: ${{ env.TF_WORKING_DIR }}/.terraform
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Checkov Static Code Analysis
        uses: bridgecrewio/checkov-action@v12.2982.0
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          soft_fail: false
          download_external_modules: false
          skip_check: CKV_TF_1,CKV_AWS_355


      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_PASSWD }}


      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_PASSWD }}


  