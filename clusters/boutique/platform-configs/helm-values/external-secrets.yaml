installCRDs: true

serviceAccount:
  create: true
  name: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::767397659229:role/external-secrets-dcff50d7e9a20b710124fd8e7d" # THIS IS THE BINDING, that connects the pod to the Terraform IRSA role

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 256Mi

# The Webhook 
webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
  
  # Let cert-manager handle the webhook cryptography
  certManager:
    enabled: true
    addInjectorAnnotations: true

certController:
  create: false
