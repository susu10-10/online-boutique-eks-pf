
global:
  domain: argocd.suworks.me

configs:
  params:
    server.insecure: true
  cm:
    repositories: |
      - url: https://github.com/susu10-10/online-boutique-eks-pf
        type: git
        name: boutique-infra

server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/group.name: boutique-shared-alb
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:767397659229:certificate/7620053e-1c9a-41c9-b7c8-f27a9697d808
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      external-dns.alpha.kubernetes.io/hostname: argocd.suworks.me
    tls: false   # TLS terminates at the ALB, not here, it matches server.insecure: true above
    hosts:
      - argocd.suworks.me
  metrics:
    enabled: true
    service:
      enabled: true
      servicePort: 8083

## Application controller
controller:
  # -- Application controller name string
  name: application-controller
  # -- The number of application controller pods to run.
  replicas: 1
  metrics:
    enabled: true
    service:
      enabled: true
      servicePort: 8082

## Repo Server
repoServer:
  # -- Repo server name
  name: repo-server
  # -- The number of repo server pods to run
  replicas: 1
  metrics:
    enabled: true
    service:
      enabled: true
      servicePort: 8084

## ApplicationSet controller
applicationSet:
  # -- ApplicationSet controller name string
  name: applicationset-controller
  # -- The number of ApplicationSet controller pods to run
  replicas: 1
  metrics:
    enabled: true
    service:
      enabled: true
      servicePort: 8080

## Redis
redis:
  # -- Enable redis
  enabled: true
  # -- Redis name
  name: redis